apiVersion: v1
kind: ConfigMap
metadata:
  name: greeter-proto-descriptor
  namespace: default
data:
  proto-descriptor: |
    CtwBChNleGFtcGxlL2hlbGxvLnByb3RvEgdleGFtcGxlIiIKDEhlbGxvUmVxdWVzdBISCgRuYW1lGAEgASgJUgRuYW1lIiUKDUhlbGxvUmVzcG9uc2UUFAoHbWVzc2FnZRgBIAEoCVIHbWVzc2FnZTJJCgdHcmVldGVyEj4KCFNheUhlbGxvEhUuZXhhbXBsZS5IZWxsb1JlcXVlc3QaFi5leGFtcGxlLkhlbGxvUmVzcG9uc2UiA4gBAVgAYgZwcm90bzM=
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: grpc-transcoder-policy
  namespace: default
spec:
  targetRefs:
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
    name: grpc-route
  grpcJsonTranscoder:
    protoDescriptor:
      type: ValueRef
      valueRef:
        name: greeter-proto-descriptor
    services:
    - "example.Greeter"
    printOptions:
      addWhitespace: true
      preserveProtoFieldNames: true
    matchIncomingRequestRoute: true
    autoMapping: true
    ignoreUnknownQueryParameters: true
    convertGrpcStatus: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grpc-route
  namespace: default
spec:
  parentRefs:
  - name: eg
  hostnames:
  - "grpc.example.com"
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /example.Greeter/
    backendRefs:
    - name: grpc-service
      port: 9000