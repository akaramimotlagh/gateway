http:
- name: "first-listener"
  address: "::"
  port: 10080
  hostnames:
  - "*"
  path:
    mergeSlashes: true
    escapedSlashesAction: UnescapeAndRedirect
  routes:
  - name: "first-route"
    hostname: "*"
    pathMatch:
      exact: "/greet/world"
    destination:
      name: "first-route-dest"
      settings:
      - endpoints:
        - host: "1.2.3.4"
          port: 50051
        name: "first-route-dest/backend/0"
    traffic:
      grpcJsonTranscoder:
        protoDescriptor: "CtwBChNleGFtcGxlL2hlbGxvLnByb3RvEgdleGFtcGxlIiIKDEhlbGxvUmVxdWVzdBISCgRuYW1lGAEgASgJUgRuYW1lIiUKDUhlbGxvUmVzcG9uc2UUFAoHbWVzc2FnZRgBIAEoCVIHbWVzc2FnZTJJCgdHcmVldGVyEj4KCFNheUhlbGxvEhUuZXhhbXBsZS5IZWxsb1JlcXVlc3QaFi5leGFtcGxlLkhlbGxvUmVzcG9uc2UiA4gBAVgAYgZwcm90bzM="
        services:
        - "example.Greeter"
        printOptions:
          addWhitespace: true
          alwaysPrintPrimitiveFields: false
        matchIncomingRequestRoute: true
        autoMapping: true
        ignoreUnknownQueryParameters: true
        convertGrpcStatus: true